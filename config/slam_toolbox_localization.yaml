# slam_toolbox 定位模式参数
# 基于已保存的地图做实时定位
# 大部分参数与 mapping 共享，但定位模式不用建图逻辑

slam_toolbox:
  ros__parameters:

    # ================================================
    # Frame 配置
    # ================================================
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    robot_base_frame: base_footprint

    # ================================================
    # 地图参数（必须与保存的地图一致）
    # ================================================
    resolution: 0.05
    max_laser_range: 12.0
    minimum_laser_range: 0.15

    # ================================================
    # 同步模式（定位模式间隔更短）
    # ================================================
    minimum_time_interval: 0.2
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1

    # ================================================
    # 定位模式：不开回环
    # 已经在加载的地图上，不需要重新检测回环
    # ================================================
    do_loop_closing: false

    # ================================================
    # 扫描匹配
    # ================================================
    use_scan_matching: true
    use_scan_barycenter: true
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 12.0
    link_scan_maximum_distance: 1.5

    # ================================================
    # 相关性扫描匹配（定位模式下窗口更小）
    # ================================================
    correlation_search_space: 0.3
    correlation_search_space_z: 0.3
    correlation_search_space_angle: 0.3

    # ================================================
    # 位姿约束
    # ================================================
    position_threshold: 0.1
    angular_threshold: 0.1
    transform_publish_period: 0.05

    # ================================================
    # 激光范围
    # ================================================
    minimum_angle: -3.14159
    maximum_angle: 3.14159

    # ================================================
    # 其他
    # ================================================
    debug_logging: false
    autostart: true